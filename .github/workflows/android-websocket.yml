name: Android WebSocket

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'build/android/**'
      - '.github/workflows/android-websocket.yml'

permissions:
  contents: read

jobs:
  websocket:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test local WebSocket connections
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash build/android/gradlew -p build/android :app:connectedDebugAndroidTest --stacktrace
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-websocket-${{ matrix.api }}
          path: |
            build/android/app/build/reports/androidTests/
            build/android/app/build/outputs/androidTest-results/
