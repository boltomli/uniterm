name: build-android

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"

      - name: Install wails3 CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16
          # setup-go does not add GOPATH/bin to PATH; wails3 (and the
          # overlay:gen / generate bindings calls inside the task) live there.
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Android compile check (no SDK needed)
        run: wails3 task android:compile:check

      - name: Build release APK (debug-signed)
        run: wails3 task android:package

      - uses: actions/upload-artifact@v4
        with:
          name: uniterm-android
          path: bin/uniTerm.apk
          if-no-files-found: error
