name: Build Linux WebKit40 (Kylin/RHEL)

# Standalone package for Kylin V10 / RHEL 8 / openEuler:
# - Built in Rocky Linux 8 → glibc 2.28
# - Links webkit2gtk-4.0 (package webkit2gtk3) WITHOUT -tags webkit2_40
#   (that tag forces runtime WebKit >= 2.40, which old Kylin repos often lack)
# - wails3 builds natively here; no webkit version tag is passed, so the
#   linker picks whatever webkit2gtk-4.0 pkg-config provides (4.0 ABI).
# Manual only — does not run the full multi-platform Build matrix.

on:
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Attach artifacts to a draft GitHub Release'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: rockylinux:8

    steps:
      - name: Install build dependencies
        run: |
          dnf -y install epel-release
          dnf -y install \
            gcc gcc-c++ make pkgconfig which curl ca-certificates tar gzip unzip xz \
            gtk3-devel webkit2gtk3-devel \
            git binutils
          # UPX (optional compression) — linux release is .tar.xz
          UPX_VER="4.2.4"
          # Pinned digest: a tampered release asset fails the build instead
          # of packing the shipped Linux binary.
          UPX_SHA256="75cab4e57ab72fb4585ee45ff36388d280c7afd72aa03e8d4b9c3cbddb474193"
          curl -sSfL -o /tmp/upx.tar.xz \
            "https://github.com/upx/upx/releases/download/v${UPX_VER}/upx-${UPX_VER}-amd64_linux.tar.xz"
          echo "${UPX_SHA256}  /tmp/upx.tar.xz" | sha256sum -c -
          tar -xJf /tmp/upx.tar.xz -C /tmp
          install -m 755 /tmp/upx-*/upx /usr/local/bin/upx
          upx --version

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26'

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'

      - name: Install Wails CLI (wails3)
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.12

      - name: Set version
        shell: bash
        run: |
          SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "VERSION=dev-${SHORT}" >> $GITHUB_ENV

      # Regenerate gitignored build assets (linux nfpm.yaml etc.) from build/config.yml
      - name: Update build assets
        shell: bash
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          wails3 task common:update:build-assets

      - name: Build (wails3, native, webkit 4.0)
        shell: bash
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          # IMPORTANT: no webkit version tag is passed. That tag means "require
          # WebKit *version* >= 2.40 at runtime", which Kylin V10's older
          # webkit2gtk3 cannot satisfy. wails3 links whatever webkit2gtk-4.0 the
          # pkg-config for webkit2gtk3-devel provides.
          pkg-config --modversion webkit2gtk-4.0 || true
          wails3 build GOOS=linux VERSION="$VERSION"   # native CGO build on rocky8
          # Sanity: binary must not require glibc newer than 2.28
          if command -v objdump >/dev/null && [ -f bin/uniTerm ]; then
            echo "GLIBC symbols required by binary:"
            objdump -T bin/uniTerm 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -5 || true
          fi

      - name: Package
        run: |
          ARCH=amd64
          NFPM_ARCH=x86_64
          PKG_SUFFIX="${ARCH}-webkit40"

          upx --best --lzma bin/uniTerm

          cd bin
          chmod +x uniTerm
          tar czf ../../uniterm-linux-${PKG_SUFFIX}-${VERSION}.tar.gz uniTerm
          cd ..

          NFPM_VER="2.46.3"
          # Pinned digest: nfpm builds the shipped .deb/.rpm, so a tampered
          # release asset must fail the build instead of injecting into the
          # distributed packages.
          NFPM_SHA256="9170d25ea056d7329def38134b2bcad98d02d221f8331610dcd619e84d28c565"
          curl -sSfL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VER}/nfpm_${NFPM_VER}_Linux_${NFPM_ARCH}.tar.gz"
          echo "${NFPM_SHA256}  /tmp/nfpm.tar.gz" | sha256sum -c -
          tar xf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
          chmod +x /usr/local/bin/nfpm

          cat > nfpm.yaml << EOF
          name: uniterm
          arch: ${ARCH}
          platform: linux
          version: ${VERSION}
          maintainer: uniTerm <uniTerm@uniterm.net>
          description: Lightweight all-in-one terminal emulator (WebKit 4.0 / glibc 2.28 / Kylin)
          homepage: https://uniterm.net
          license: Proprietary
          depends:
            - libgtk-3-0
            - libwebkit2gtk-4.0-37
          overrides:
            rpm:
              depends:
                - gtk3
                - webkit2gtk3
          contents:
            - src: bin/uniTerm
              dst: /usr/bin/uniterm
            - src: build/linux/uniTerm.desktop
              dst: /usr/share/applications/uniterm.desktop
            - src: build/linux/icons/hicolor
              dst: /usr/share/icons/hicolor
          EOF

          nfpm package --config nfpm.yaml --packager deb \
            --target "uniterm-linux-${PKG_SUFFIX}-${VERSION}.deb"
          nfpm package --config nfpm.yaml --packager rpm \
            --target "uniterm-linux-${PKG_SUFFIX}-${VERSION}.rpm"
          ls -la uniterm-linux-${PKG_SUFFIX}-*

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: uniTerm-linux-amd64-webkit40
          path: |
            uniterm-linux-amd64-webkit40-*.tar.gz
            uniterm-linux-amd64-webkit40-*.deb
            uniterm-linux-amd64-webkit40-*.rpm

      - name: Create draft release
        if: inputs.upload_release == true
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          tag_name: webkit40-${{ env.VERSION }}
          name: WebKit40 / Kylin ${{ env.VERSION }}
          draft: true
          prerelease: true
          body: |
            Preview build for **Kylin V10 / RHEL 8 / openEuler** (WebKit2GTK 4.0 + **glibc 2.28**).

            ```bash
            sudo yum install -y gtk3 webkit2gtk3
            sudo rpm -Uvh uniterm-linux-amd64-webkit40-*.rpm
            uniterm
            ```
          files: |
            uniterm-linux-amd64-webkit40-*.tar.gz
            uniterm-linux-amd64-webkit40-*.deb
            uniterm-linux-amd64-webkit40-*.rpm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}