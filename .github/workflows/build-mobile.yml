name: build-mobile

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target ABI (arm64 for real devices, amd64 for emulator)'
        required: false
        default: 'arm64'
        type: choice
        options: ['arm64', 'amd64']
  push:
    tags: ['v*']

jobs:
  android:
    name: Android APK (arm64)
    runs-on: ubuntu-latest
    env:
      # workflow_dispatch input; tag builds are always arm64 (real devices)
      TARGET_ARCH: ${{ inputs.arch || 'arm64' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"

      - name: Install wails3 CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.16
          # setup-go does not add GOPATH/bin to PATH; wails3 (and the
          # overlay:gen / generate bindings calls inside the task) live there.
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Android compile check (no SDK needed)
        run: wails3 task android:compile:check

      - name: Build release APK (debug-signed)
        run: wails3 task android:package ARCH=${TARGET_ARCH}

      # iOS note: building an .app for real devices needs Apple codesigning
      # identities/secrets; add a macos-latest job here once signing is set up.

      - name: Rename artifact
        run: cp bin/uniTerm.apk "bin/uniTerm-${GITHUB_REF_NAME}-android-${TARGET_ARCH}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: uniterm-android-${{ env.TARGET_ARCH }}
          path: bin/uniTerm-*-android-*.apk
          if-no-files-found: error
